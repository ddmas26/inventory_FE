server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: unknown paths must fall back to index.html,
    # otherwise a refresh on /products returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend calls a relative "/api", so nginx forwards it to the backend.
    # "app" is the backend service name on the compose network; change it here if
    # you run this container somewhere else.
    location /api/ {
        proxy_pass http://app:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend fallback route for images stored on local disk instead of MinIO.
    location /uploads/ {
        proxy_pass http://app:9080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite fingerprints filenames in /assets, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients keep an old asset manifest.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
